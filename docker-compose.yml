version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql_timesheet
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timesheetdb
    ports:
      - "3306:3306"
    volumes:
      - timesheetvol:/var/lib/mysql
    networks:
      - timesheet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    image: timesheet-tarhouni-youssef-4nids3:latest
    container_name: timesheet_app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8085:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/timesheetdb?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - timesheet-network
    restart: on-failure

volumes:
  timesheetvol:

networks:
  timesheet-network:
    driver: bridge
