apiVersion: apps/v1
kind: Deployment
metadata:
  name: timesheet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timesheet
  template:
    metadata:
      labels:
        app: timesheet
    spec:
      containers:
        - name: timesheet
          image: j00seph/timesheet-devops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: LOGGING_FILE_NAME
              value: /tmp/timesheet-devops.log
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: timesheet
spec:
  type: NodePort
  selector:
    app: timesheet
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
